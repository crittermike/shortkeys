name: CI Tests
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.x

jobs:
  unit:
    name: Unit tests, typecheck and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:firefox

  e2e-chromium:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-chromium-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-firefox:
    name: E2E (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Selenium Manager downloads Firefox stable and geckodriver; the tests fail if Firefox is older than 153.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-${{ github.run_id }}
          restore-keys: selenium-${{ runner.os }}-
      - run: npm run build:firefox
      - run: npm run test:e2e:firefox
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-firefox-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-upgrade:
    name: Upgrade and restart (Chromium)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:upgrade
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-upgrade-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # Baselines in e2e/__screenshots__ are rendered in this image. Keep the tag in sync with @playwright/test
    # and regenerate them deliberately with `npm run test:e2e:visual:update`.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check the image matches the installed Playwright
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.64.1"
      - run: npm run build
      - run: npm run test:e2e:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ci-passed:
    name: CI passed
    if: always()
    needs: [unit, e2e-chromium, e2e-firefox, e2e-upgrade, visual]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
